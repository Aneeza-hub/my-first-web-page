
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <div class="calculator">

        <div class="top">
            <button class="menu" onclick="showMessage()">☰</button>
            <h2>Standard</h2>
            <span class="history">◷</span>
        </div>

        <p id="message">Welcome to my Calculator!</p>

        <!-- Calculator Display -->
        <input type="text" id="display" value="0" readonly
               aria-label="Calculator display">

        <!-- Memory Buttons -->
        <div class="memory-row">
            <button id="mc" onclick="memoryClear()" disabled>MC</button>
            <button id="mr" onclick="memoryRecall()" disabled>MR</button>
            <button onclick="memoryAdd()">M+</button>
            <button onclick="memorySubtract()">M−</button>
            <button onclick="memorySave()">MS</button>
            <button id="mv" onclick="memoryMore()" disabled>M∨</button>
        </div>

        <!-- Memory Panel -->
        <div id="memory-panel" class="memory-panel">
            <h3>Memory</h3>
            <div id="memory-list"></div>
        </div>

        <!-- Calculator Keypad -->
        <table>
            <tbody>
                <tr>
                    <td><button onclick="percentage()">%</button></td>
                    <td><button onclick="clearEntry()">CE</button></td>
                    <td><button onclick="clearAll()">C</button></td>
                    <td><button onclick="backspace()">⌫</button></td>
                </tr>

                <tr>
                    <td><button onclick="reciprocal()">¹/x</button></td>
                    <td><button onclick="square()">x²</button></td>
                    <td><button onclick="squareRoot()">²√x</button></td>
                    <td><button onclick="chooseOperator('/')">÷</button></td>
                </tr>

                <tr>
                    <td><button onclick="pressNumber('7')">7</button></td>
                    <td><button onclick="pressNumber('8')">8</button></td>
                    <td><button onclick="pressNumber('9')">9</button></td>
                    <td><button onclick="chooseOperator('*')">×</button></td>
                </tr>

                <tr>
                    <td><button onclick="pressNumber('4')">4</button></td>
                    <td><button onclick="pressNumber('5')">5</button></td>
                    <td><button onclick="pressNumber('6')">6</button></td>
                    <td><button onclick="chooseOperator('-')">−</button></td>
                </tr>

                <tr>
                    <td><button onclick="pressNumber('1')">1</button></td>
                    <td><button onclick="pressNumber('2')">2</button></td>
                    <td><button onclick="pressNumber('3')">3</button></td>
                    <td><button onclick="chooseOperator('+')">+</button></td>
                </tr>

                <tr>
                    <td><button onclick="changeSign()">+/−</button></td>
                    <td><button onclick="pressNumber('0')">0</button></td>
                    <td><button onclick="pressNumber('.')">.</button></td>
                    <td><button class="equal" onclick="calculate()">=</button></td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- JavaScript File -->
    <script src="script1.js"></script>

</body>
</html>
