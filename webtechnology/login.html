<!DOCTYPE html>
<html>
<head>
    <title>User Registration System - Login</title>
</head>

<body bgcolor="#F2F6FA">

<table width="100%" border="0" cellpadding="15" bgcolor="#1F4E78">
    <tr>
        <td align="center">
            <font color="white" size="6">
                <b>User Registration System</b>
            </font>
            <br>
            <font color="white" size="3">
                Welcome to our registration portal
            </font>
        </td>
    </tr>
</table>

<br><br>

<table width="80%" align="center" border="0" cellpadding="10">
    <tr>
        <td align="center">
            <font size="5">
                <b>Login</b>
            </font>
            <br><br>
            <font size="3">
                Please enter your username and password
            </font>
        </td>
    </tr>
</table>

<br>

<table width="450" align="center" border="1" cellpadding="20" bgcolor="white">
    <tr>
        <td>

            <form action="register.html" method="get">

                <table width="100%" cellpadding="10">

                    <tr>
                        <td>
                            <b>Username:</b>
                        </td>

                        <td>
                            <input type="text"
                                   name="username"
                                   size="25"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <b>Password:</b>
                        </td>

                        <td>
                            <input type="password"
                                   name="password"
                                   size="25"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">
                            <br>
                            <input type="submit" value="Login">
                        </td>
                    </tr>

                </table>

            </form>

        </td>
    </tr>
</table>

<br><br><br><br><br>

<table width="100%" border="0" cellpadding="12" bgcolor="#1F4E78">
    <tr>
        <td align="center">

            <font color="white">
                <b>User Registration System</b>
                <br>
                &copy; 2026 All Rights Reserved
            </font>

        </td>
    </tr>
</table>

</body>
</html>
