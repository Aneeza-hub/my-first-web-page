<!DOCTYPE html>
<html>
<head>
    <title>User Registration System - Registration</title>
</head>

<body bgcolor="#F2F6FA">

<table width="100%" border="0" cellpadding="15" bgcolor="#1F4E78">
    <tr>
        <td align="center">

            <font color="white" size="6">
                <b>User Registration System</b>
            </font>

            <br>

            <font color="white" size="3">
                Create your account
            </font>

        </td>
    </tr>
</table>

<br><br>

<table width="80%" align="center" border="0" cellpadding="10">
    <tr>
        <td align="center">

            <font size="5">
                <b>Registration Form</b>
            </font>

            <br><br>

            <font size="3">
                Please enter your information below
            </font>

        </td>
    </tr>
</table>

<br>

<table width="600" align="center" border="1" cellpadding="20" bgcolor="white">
    <tr>
        <td>

            <form action="thankyou.html" method="get">

                <table width="100%" cellpadding="8">

                    <tr>
                        <td width="40%">
                            <b>Login Name:</b>
                        </td>

                        <td>
                            <input type="text"
                                   name="loginname"
                                   size="30"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <b>Enter Password:</b>
                        </td>

                        <td>
                            <input type="password"
                                   name="password"
                                   size="30"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <b>Re-enter Password:</b>
                        </td>

                        <td>
                            <input type="password"
                                   name="repassword"
                                   size="30"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <b>Gender:</b>
                        </td>

                        <td>

                            <input type="radio"
                                   name="gender"
                                   value="Male"
                                   required>

                            Male

                            &nbsp;&nbsp;&nbsp;

                            <input type="radio"
                                   name="gender"
                                   value="Female">

                            Female

                        </td>
                    </tr>

                    <tr>
                        <td>
                            <b>Country:</b>
                        </td>

                        <td>

                            <select name="country" required>

                                <option value="">
                                    -- Select Country --
                                </option>

                                <option>Pakistan</option>
                                <option>India</option>
                                <option>China</option>
                                <option>United Kingdom</option>
                                <option>United States</option>
                                <option>Canada</option>
                                <option>Australia</option>

                            </select>

                        </td>
                    </tr>

                    <tr>
                        <td valign="top">
                            <b>Licence:</b>
                        </td>

                        <td>

                            <textarea rows="8"
                                      cols="40"></textarea>

                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">

                            <input type="checkbox"
                                   name="agreement"
                                   required>

                            <b>I agree with licence</b>

                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">

                            <br>

                            <input type="submit"
                                   value="Register">

                        </td>
                    </tr>

                </table>

            </form>

        </td>
    </tr>
</table>

<br><br><br>

<table width="100%" border="0" cellpadding="12" bgcolor="#1F4E78">
    <tr>
        <td align="center">

            <font color="white">
                <b>User Registration System</b>
                <br>
                &copy; 2026 All Rights Reserved
            </font>

        </td>
    </tr>
</table>

</body>
</html>
